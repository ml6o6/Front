<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Заглушка контактов" />
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon" />
    <script src="js/main.js"></script>
    <link rel="stylesheet" href="css/styles.css" />
    <title>Контакты - Frontend</title>
    <meta
      name="description"
      content="Узнайте больше о нашей компании и истории"
    />
  </head>
  <body>
    <div class="page-container">
      <div class="logo" href="index.html">Frontend</div>
      <div class="nav">
        <ul class="nav-list">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Главная</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="news.html">Новости</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="goods.html">Товары</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="contacts.html">Контакты</a>
          </li>
        </ul>
      </div>
      <div class="content">
        <nav class="bread" aria-label="Хлебные крошки">
          <a href="index.html">Главная</a> →
          <span>Контакты</span>
        </nav>
        <div class="pochta">
          <h2 class="contact-title">Адрес электронной почты:</h2>
          <div class="mail">smirnov.ilja.2006@gmail.com</div>
        </div>
        <div class="telephone">
          <h2 class="contact-title">Телефон:</h2>
          <div class="phone">+7 (985) 354-06-61</div>
        </div>
        <p>
          <button id="openDialog" type="button">Написать мне</button>
          <dialog id="contactDialog" aria-labelledby="dialogTitle">
            <h2 id="dialogTitle">Обратная связь</h2>
            <form id="contactForm" method="dialog" novalidate>
              <p>
                <label for="name"
                  >Имя*:<br />
                  <input
                    id="name"
                    name="name"
                    type="text"
                    required
                    minlength="2"
                    placeholder="Введите ваше имя"
                    autocomplete="given-name"
                  />
                </label>
              </p>

              <p>
                <label for="email"
                  >E-mail*:<br />
                  <input
                    id="email"
                    name="email"
                    type="email"
                    required
                    placeholder="example@mail.com"
                    autocomplete="email"
                  />
                </label>
              </p>

              <p>
                <label for="phone"
                  >Телефон*:<br />
                  <input
                    id="phone"
                    name="phone"
                    type="tel"
                    placeholder="+7 (900) 000-00-00"
                    required
                    pattern="^\+7 \(\d{3}\) \d{3}-\d{2}-\d{2}$"
                  /> </label
                ><br />
                <small>Формат: +7 (900) 000-00-00</small>
              </p>

              <p>
                <label for="topic"
                  >Тема*:<br />
                  <select id="topic" name="topic" required>
                    <option value="">Выберите тему</option>
                    <option>Вопрос</option>
                    <option>Заказ</option>
                    <option>Предложение</option>
                  </select>
                </label>
              </p>

              <p>
                <label for="message"
                  >Сообщение*:<br />
                  <textarea
                    id="message"
                    name="message"
                    rows="5"
                    required
                    placeholder="Напишите ваше сообщение..."
                  ></textarea>
                </label>
              </p>

              <p>
                <button type="button" id="closeDialog">Закрыть</button>
                <button type="submit">Отправить</button>
              </p>
            </form>
          </dialog>
        </p>
      </div>
      <div class="footer">
        <p>&copy; 2025 Front Ilja. Все права защищены.</p>
        <p>Телефон: +7 (985) 354-06-61</p>
      </div>
    </div>
  </body>
</html>
